<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BidCraft AI - Promo Tile</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 440px; height: 280px; overflow: hidden;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #F8FAFC;
    background: radial-gradient(circle at 20% 20%, rgba(99,102,241,.45), transparent 55%),
                radial-gradient(circle at 90% 90%, rgba(6,182,212,.4), transparent 55%), #0B0F19;
    display: flex; flex-direction: column; justify-content: center; padding: 36px;
  }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .icon { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg,#6366F1,#06B6D4);
    display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .name { font-size: 28px; font-weight: 800; }
  h1 { font-size: 30px; line-height: 1.15; font-weight: 800; }
  h1 em { font-style: normal; background: linear-gradient(135deg,#818CF8,#22D3EE); -webkit-background-clip: text; color: transparent; }
</style>
</head>
<body>
  <div class="logo"><div class="icon">⚡</div><span class="name">BidCraft AI</span></div>
  <h1>Upwork proposals<br><em>in one click</em></h1>
</body>
</html>
